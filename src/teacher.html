<title>개형 배치 선생님</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* layout: 관리 화면 한 줄. 잠금 → 출제 버전 → 학생 링크 → 학생 기록 표 */
:root{
  --paper:#F5F7F6; --card:#FFFFFF; --ink:#1B2620; --muted:#58665E; --line:#D5DDD8; --grid:#E6ECE8;
  --accent:#1F7A5A; --accent-soft:#DCF0E7; --ok:#1E7F55; --bad:#B9382F; --bad-soft:#FBE4E1;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101513; --card:#171E1B; --ink:#E5EEE9; --muted:#9AABA2; --line:#2A3530; --grid:#18201C;
  --accent:#5CC79C; --accent-soft:#163327; --ok:#58C793; --bad:#F2877F; --bad-soft:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101513; --card:#171E1B; --ink:#E5EEE9; --muted:#9AABA2; --line:#2A3530; --grid:#18201C;
  --accent:#5CC79C; --accent-soft:#163327; --ok:#58C793; --bad:#F2877F; --bad-soft:#3A1C1A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.app{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.8rem;margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0}
.kicker{font-size:.8rem;letter-spacing:.06em;color:var(--accent);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
label{font-weight:500;font-size:.92rem}
input{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
input:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:999px;padding:9px 20px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--card)}
button.ghost{background:transparent;color:var(--accent)}
button.danger{border-color:var(--bad);background:var(--bad);color:var(--card)}
button.danger.ghost{background:transparent;color:var(--bad)}
button:focus-visible,.opt:focus-within{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
.msg{margin:0;font-size:.88rem;min-height:1.3em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.note{color:var(--muted);font-size:.85rem;margin:0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt b{font-weight:600}
.opt span{color:var(--muted);font-size:.85rem}
.opt.on{border:2px solid var(--accent);background:var(--accent-soft)}
.opt.on b{color:var(--accent)}
.confirm{background:var(--bad-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;color:var(--bad);font-weight:500}
#link{flex:1;font-size:.9rem}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.82rem}
td.num{text-align:right}
.chip{font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border-radius:10px;padding:8px 12px}
.stat span{display:block;font-size:.75rem;color:var(--muted)} .stat b{font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:520px){.modes{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="app">
  <header>
    <span class="kicker">개형 배치 연습</span>
    <h1>선생님 페이지</h1>
  </header>

  <form class="panel" id="lockForm" novalidate>
    <label for="pw">비밀번호</label>
    <div class="row">
      <input type="password" id="pw" autocomplete="current-password" style="flex:1">
      <button type="submit" id="unlockBtn">들어가기</button>
    </div>
    <p class="msg err" id="lockMsg"></p>
    <p class="note">넷리파이에 등록한 TEACHER_PASSWORD 값을 넣어 주세요.</p>
  </form>

  <div id="admin" hidden style="display:flex;flex-direction:column;gap:14px">
    <section class="panel">
      <h2>출제 버전</h2>
      <div class="modes" role="radiogroup" aria-label="출제 버전">
        <label class="opt" id="optPos"><input type="radio" name="mode" value="positive"><b>최고차항 양수만</b><span>식에 a 없이 내고, 보기도 최고차항이 양수인 개형만 보여 줘요.</span></label>
        <label class="opt" id="optMix"><input type="radio" name="mode" value="mixed"><b>섞인 버전</b><span>식을 a(x − α)… 꼴로 내고, 부호가 반대인 개형까지 모두 보여 줘요. 가능한 개형을 양쪽에서 모두 골라야 해요.</span></label>
      </div>
      <p class="msg" id="modeMsg"></p>
      <p class="note">바꾸면 그 뒤에 시작하는 학생부터 적용돼요. 이미 풀고 있는 학생은 처음 버전으로 끝까지 풀어요.</p>
    </section>

    <section class="panel">
      <h2>학생에게 보낼 링크</h2>
      <div class="row">
        <input type="text" id="link" readonly aria-label="학생용 링크">
        <button type="button" class="ghost" id="copyBtn">복사</button>
      </div>
      <p class="msg" id="copyMsg"></p>
    </section>

    <section class="panel">
      <div class="row" style="justify-content:space-between">
        <h2>학생 기록</h2>
        <button type="button" class="ghost" id="refreshBtn">새로고침</button>
      </div>
      <div class="stats">
        <div class="stat"><span>기록 수</span><b id="stN">0</b></div>
        <div class="stat"><span>평균 맞힌 수</span><b id="stAvg">-</b></div>
        <div class="stat"><span>평균 걸린 시간</span><b id="stTime">-</b></div>
      </div>
      <div class="tbl"><table>
        <thead><tr><th>이름</th><th style="text-align:right">맞힌 수</th><th style="text-align:right">걸린 시간</th><th>버전</th><th>제출 시각</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <p class="note" id="empty" hidden>아직 기록이 없어요.</p>
      <div class="row" style="margin-top:6px"><button type="button" class="danger ghost" id="resetBtn">기록 모두 지우기</button></div>
      <div class="confirm" id="confirmBox" hidden>
        <p>학생 기록을 모두 지워요. 되돌릴 수 없어요.</p>
        <div class="row"><button type="button" class="danger" id="resetYes">모두 지우기</button><button type="button" class="ghost" id="resetNo">취소</button></div>
      </div>
      <p class="msg" id="resetMsg"></p>
    </section>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let PW='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(id,text,kind){const e=$(id);e.textContent=text;e.className='msg'+(kind?' '+kind:'')}
const fmt=ms=>{const s=Math.round(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const when=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
async function teacher(body){
  try{const r=await fetch('/api/teacher',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:PW,...body})});
    const d=await r.json().catch(()=>({}));return {ok:r.ok,...d}}
  catch(e){return {ok:false,error:'서버에 연결할 수 없어요. 넷리파이에 배포된 주소에서 열어 주세요.'}}
}
function showMode(m){$('optPos').classList.toggle('on',m==='positive');$('optMix').classList.toggle('on',m==='mixed');
  document.querySelector(`input[name=mode][value=${m}]`).checked=true}
async function loadRecords(){
  const d=await teacher({action:'list'});const tb=$('rows');tb.innerHTML='';
  if(!d.ok){$('empty').hidden=false;$('empty').textContent=d.error||'기록을 불러오지 못했어요.';return}
  const r=d.records;$('empty').hidden=r.length>0;$('empty').textContent='아직 기록이 없어요.';
  $('stN').textContent=r.length;
  $('stAvg').textContent=r.length?(r.reduce((s,x)=>s+x.correct,0)/r.length).toFixed(1)+' / '+r[0].total:'-';
  $('stTime').textContent=r.length?fmt(r.reduce((s,x)=>s+x.ms,0)/r.length):'-';
  r.forEach(x=>{const tr=document.createElement('tr');
    tr.innerHTML=`<td>${esc(x.name)}</td><td class="num">${x.correct} / ${x.total}</td><td class="num">${fmt(x.ms)}</td><td><span class="chip">${x.mode==='mixed'?'섞인':'양수만'}</span></td><td>${when(x.at)}</td>`;tb.appendChild(tr)});
}
$('pw').addEventListener('input',()=>msg('lockMsg','','err'));
$('lockForm').addEventListener('submit',async e=>{e.preventDefault();
  const v=$('pw').value;if(!v){msg('lockMsg','비밀번호를 입력해 주세요.','err');return}
  PW=v;$('unlockBtn').disabled=true;msg('lockMsg','확인하는 중…');
  const d=await teacher({action:'check'});$('unlockBtn').disabled=false;
  if(!d.ok){PW='';msg('lockMsg',d.error||'확인하지 못했어요.','err');return}
  $('lockForm').hidden=true;$('admin').hidden=false;showMode(d.mode);
  $('link').value=new URL('/',location.href).toString();loadRecords();
});
document.querySelectorAll('input[name=mode]').forEach(inp=>inp.addEventListener('change',async()=>{
  const m=inp.value;showMode(m);msg('modeMsg','저장하는 중…');
  const d=await teacher({action:'setMode',mode:m});
  if(!d.ok){msg('modeMsg',d.error||'바꾸지 못했어요.','err');return}
  msg('modeMsg',m==='mixed'?'섞인 버전으로 바꿨어요.':'최고차항 양수만 나오는 버전으로 바꿨어요.','ok')}));
$('copyBtn').addEventListener('click',()=>{const t=$('link').value;
  const fb=()=>{$('link').focus();$('link').select();msg('copyMsg','링크를 선택해 두었어요. Ctrl+C로 복사해 주세요.')};
  try{navigator.clipboard.writeText(t).then(()=>msg('copyMsg','복사했어요.','ok'),fb)}catch(e){fb()}});
$('refreshBtn').addEventListener('click',loadRecords);
$('resetBtn').addEventListener('click',()=>{$('confirmBox').hidden=false;$('resetBtn').hidden=true});
$('resetNo').addEventListener('click',()=>{$('confirmBox').hidden=true;$('resetBtn').hidden=false});
$('resetYes').addEventListener('click',async()=>{$('resetYes').disabled=true;const d=await teacher({action:'reset'});$('resetYes').disabled=false;
  $('confirmBox').hidden=true;$('resetBtn').hidden=false;
  if(!d.ok){msg('resetMsg',d.error||'지우지 못했어요.','err');return}
  msg('resetMsg',`기록 ${d.deleted}개를 지웠어요.`,'ok');loadRecords()});
</script>
